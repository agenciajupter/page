<style>
/* Layout: cartão único em coluna, estilo "cosmos" dos posts — planeta laranja no canto, grade de pontos, botões empilhados */
:root{
  --space:#0d0d10;        /* fundo cósmico dos posts */
  --carbon:#1f1f22;       /* círculo do logo */
  --panel:#16161a;
  --btn:#1b1b20;
  --btn-hover:#221a15;
  --line:#2b2b31;
  --cream:#efe7dc;        /* creme do logo e do post de rebranding */
  --muted:#a39d95;
  --orange:#f26b1d;       /* laranja da marca */
  --orange-deep:#d9560c;
  --font-display:"Fredoka", "Nunito", system-ui, sans-serif;
  --font-text:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--space);color:var(--cream);
  font-family:var(--font-text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.stage{
  min-height:100%;display:flex;justify-content:center;align-items:flex-start;
  padding-block:32px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.card{
  position:relative;width:100%;max-width:420px;overflow:hidden;
  border-radius:28px;background:var(--panel);
  border:1px solid var(--line);
  box-shadow:0 30px 80px -30px rgba(242,107,29,.25);
  isolation:isolate;
}
/* céu estrelado */
.sky{
  position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1px 1px at 20px 30px, rgba(239,231,220,0.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 90px 110px, rgba(239,231,220,0.4) 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 150px 60px, rgba(239,231,220,0.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 60px 170px, rgba(239,231,220,0.35) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 175px 160px, rgba(239,231,220,0.65) 50%, transparent 51%),
    radial-gradient(1px 1px at 120px 15px, rgba(239,231,220,0.3) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 35px 95px, rgba(239,231,220,0.45) 50%, transparent 51%),
    radial-gradient(1px 1px at 105px 185px, rgba(239,231,220,0.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 185px 85px, rgba(239,231,220,0.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 140px 130px, rgba(239,231,220,0.3) 50%, transparent 51%),
    linear-gradient(180deg, #121216 0%, var(--space) 60%);
  background-size:190px 190px,190px 190px,190px 190px,190px 190px,190px 190px,190px 190px,190px 190px,190px 190px,190px 190px,190px 190px,100% 100%;
}
/* planeta (referência ao Júpiter dos posts) */
.planet{
  position:absolute;z-index:-1;pointer-events:none;
  width:300px;height:300px;top:-120px;right:-130px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 60%, transparent 40%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.85) 100%),
    radial-gradient(ellipse 18% 9% at 38% 66%, #b9481a 0 60%, transparent 70%),
    repeating-linear-gradient(170deg,
      #f4c9a0 0 14px, #e89a5c 14px 26px, #f6dcc2 26px 34px,
      #d9762f 34px 50px, #efb27e 50px 62px, #c9652a 62px 70px);
  box-shadow:inset -30px -10px 60px rgba(0,0,0,.6), 0 0 80px rgba(242,107,29,.25);
  animation:drift 40s linear infinite alternate;
}
@keyframes drift{to{transform:rotate(6deg) translateY(6px)}}
.inner{display:flex;flex-direction:column;gap:28px;padding:36px 26px 26px}

/* logo */
.logo{
  width:104px;height:104px;border-radius:50%;display:block;flex:none;object-fit:cover;
  background:var(--carbon);
  box-shadow:0 0 0 4px var(--panel), 0 0 0 5px var(--line);
}
.head{display:flex;flex-direction:column;gap:18px}
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--orange)}
h1{
  margin:0;font-family:var(--font-text);font-weight:300;font-size:30px;line-height:1.12;
  letter-spacing:-.01em;text-wrap:balance;
}
h1 strong{font-weight:800;color:var(--orange)}
.lede{margin:0;color:var(--muted);font-size:14.5px;max-width:34ch}

.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:0;padding:0;list-style:none}
.tags li{
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);
  background:var(--btn);color:var(--cream);min-width:0;
}
@media (max-width:360px){.tags li{font-size:10px;letter-spacing:.03em}}

/* botões */
.links{display:flex;flex-direction:column;gap:10px}
.btn{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--cream);
  padding:14px 16px;border-radius:16px;border:1px solid var(--line);
  background:var(--btn);
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
  user-select:none;-webkit-user-select:none;
}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
@media (hover:hover){
  .btn:hover{transform:translateY(-2px);border-color:rgba(242,107,29,.6);background:var(--btn-hover)}
  .btn.primary:hover{background:var(--orange-deep);border-color:var(--orange-deep)}
}
.btn:active{transform:scale(.98)}
.ico{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:#2a1d15;color:var(--orange);
}
.ico svg{width:22px;height:22px}
.txt{display:flex;flex-direction:column;min-width:0;flex:1}
.txt b{font-weight:700;font-size:15px}
.txt small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{width:18px;height:18px;flex:none;opacity:.6}

.btn.primary{background:var(--orange);border-color:var(--orange);color:#1a0d05}
.btn.primary .ico{background:rgba(26,13,5,.14);color:#1a0d05}
.btn.primary .txt small{color:rgba(26,13,5,.72)}
.btn.primary .arrow{opacity:.8}

.foot{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);
}
.foot .sig{height:32px;width:auto;display:block}
.copy{
  font:inherit;color:var(--cream);background:none;border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
}
.copy:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;user-select:all}

/* entrada suave */
.inner > *{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.inner > *:nth-child(2){animation-delay:.06s}
.inner > *:nth-child(3){animation-delay:.12s}
.inner > *:nth-child(4){animation-delay:.18s}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){
  .inner > *, .planet{animation:none}
  .btn{transition:none}
}
@media (max-width:360px){
  h1{font-size:26px}
  .inner{padding:30px 18px 20px}
}
</style>
</head>
